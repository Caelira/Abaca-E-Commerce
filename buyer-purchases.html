<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
<!-- show purchases-->
<main class="main-container" style="display: flex; gap: 30px;">

    <div style="width: 250px; flex-shrink: 0;">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color);">

            <img th:if="${currentUser.hasProfileImage()}" th:src="@{/account/profile-image/{id}(id=${currentUser.idUser})}" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; box-shadow: var(--shadow-sm);">
            <div th:unless="${currentUser.hasProfileImage()}" style="width: 50px; height: 50px; border-radius: 50%; background: var(--theme-color); display: flex; align-items: center; justify-content: center; font-size: 1.5em; color: white; font-weight: bold; box-shadow: var(--shadow-sm);" th:text="${#strings.substring(currentUser.fullName != null ? currentUser.fullName : currentUser.username, 0, 1).toUpperCase()}"></div>

            <div>
                <div style="font-weight: bold; color: var(--text-main);" th:text="${currentUser.fullName != null ? currentUser.fullName : currentUser.username}"></div>
                <a th:href="@{/account/settings}" style="font-size: 0.85em; color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.3s;">✎ Edit Profile</a>
            </div>
        </div>
        <ul style="list-style: none; padding: 0; line-height: 2.5; margin: 0;">
            <li><a th:href="@{/account/settings}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">My Profile</a></li>
            <li><a th:href="@{/account/addresses}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">Addresses</a></li>
            <li><a th:href="@{/buyer/purchases}" style="text-decoration: none; color: var(--theme-color); font-weight: bold; display: flex; align-items: center; gap: 10px;">Purchases</a></li>
        </ul>
    </div>

    <div style="flex: 1;">
        <h2 style="margin-top: 0; margin-bottom: 20px; color: var(--text-main);">My Purchases</h2>

        <div th:if="${#lists.isEmpty(orders)}" style="background: var(--card-bg); padding: 80px; text-align: center; border-radius: var(--border-radius); box-shadow: var(--shadow-sm);">
            <div style="font-size: 4em; margin-bottom: 15px;">🛒</div>
            <div style="color: var(--text-muted); font-size: 1.2em; font-weight: 600;">No orders yet</div>
        </div>

        <div th:each="order : ${orders}" style="background: var(--card-bg); margin-bottom: 25px; border-radius: var(--border-radius); box-shadow: var(--shadow-sm); overflow: hidden; border: 1px solid var(--border-color);">

            <div style="padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #fafafa;">
                <div style="font-weight: bold; color: var(--text-main);">Order <span th:text="'#' + ${order.idOrder}"></span></div>
                <div style="color: var(--theme-color); font-weight: bold; text-transform: uppercase; padding: 5px 15px; background: rgba(255,100,49,0.1); border-radius: 50px; font-size: 0.85em;" th:text="${order.orderStatus}"></div>
            </div>

            <div th:each="item : ${orderItemsMap.get(order.idOrder)}" style="padding: 20px; display: flex; border-bottom: 1px dashed var(--border-color);">
                <img th:src="@{/products/image/{id}(id=${item.product.idProduct})}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; margin-right: 20px; box-shadow: var(--shadow-sm);">
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <div style="font-weight: bold; color: var(--text-main); font-size: 1.1em;" th:text="${item.product.productName}"></div>
                    <div style="color: var(--text-muted); margin-top: 8px; font-weight: 600;">x<span th:text="${item.orderQuantity}"></span></div>
                </div>
                <div style="color: var(--theme-color); font-weight: bold; display: flex; align-items: center; font-size: 1.2em;">
                    ₱<span th:text="${item.finalUnitPrice * item.orderQuantity}"></span>
                </div>
            </div>

            <div style="padding: 20px; display: flex; justify-content: flex-end; align-items: center; gap: 30px;">
                <div style="color: var(--text-muted); font-weight: 600;">Order Total:
                    <span style="color: var(--theme-color); font-size: 1.6em; font-weight: 800; margin-left: 10px;">
                        ₱<span th:text="${#aggregates.sum(orderItemsMap.get(order.idOrder).![finalUnitPrice * orderQuantity]) + 50.00}"></span>
                    </span>
                </div>
                <a th:href="@{/buyer/orders/{id}(id=${order.idOrder})}" class="btn-theme" style="width: auto; padding: 12px 30px; text-decoration: none;">View Details</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
