<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
<main class="main-container" style="display: flex; gap: 30px;">

  <div style="width: 250px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color);">
      <div style="width: 50px; height: 50px; border-radius: 50%; background: var(--theme-color); display: flex; align-items: center; justify-content: center; font-size: 1.5em; color: white; font-weight: bold; box-shadow: var(--shadow-sm);" th:text="${#strings.substring(currentUser.fullName != null ? currentUser.fullName : currentUser.username, 0, 1).toUpperCase()}"></div>
      <div>
        <div style="font-weight: bold; color: var(--text-main);" th:text="${currentUser.fullName != null ? currentUser.fullName : currentUser.username}"></div>
        <a th:href="@{/account/settings}" style="font-size: 0.85em; color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.3s;">✎ Edit Profile</a>
      </div>
    </div>
    <ul style="list-style: none; padding: 0; line-height: 2.5; margin: 0;">
      <li><a th:href="@{/account/settings}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">My Profile</a></li>
      <li><a th:href="@{/account/addresses}" style="text-decoration: none; color: var(--theme-color); font-weight: bold; display: flex; align-items: center; gap: 10px;">Addresses</a></li>
      <li><a th:href="@{/buyer/purchases}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">Purchases</a></li>
    </ul>
  </div>

  <div style="flex: 1; background: var(--card-bg); border-radius: var(--border-radius); box-shadow: var(--shadow-sm); padding: 30px;">

    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px;">
      <h2 style="margin: 0; color: var(--text-main);">My Addresses</h2>
      <button type="button" onclick="openAddressModal()" class="btn-theme" style="width: auto; padding: 10px 20px;">+ Add New Address</button>
    </div>

    <div th:if="${#lists.isEmpty(addresses)}" style="text-align: center; padding: 50px;">
      <p style="color: var(--text-muted); font-size: 1.1em; font-weight: 500;">You don't have any addresses saved yet.</p>
    </div>

    <div th:each="addr : ${addresses}" style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px;">
      <div style="flex: 1;">
        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px;">
          <strong th:text="${currentUser.fullName != null ? currentUser.fullName : currentUser.username}" style="color: var(--text-main); font-size: 1.1em;"></strong>
          <span style="background: rgba(255,100,49,0.1); color: var(--theme-color); font-size: 0.7em; padding: 3px 8px; border-radius: 50px; font-weight: bold;" th:text="${addr.addressType}"></span>
        </div>
        <div style="color: var(--text-muted); font-size: 0.95em; line-height: 1.5;">
          <div th:text="${addr.street}"></div>
          <div>Brgy. <span th:text="${addr.brgy}"></span>, <span th:text="${addr.municipality}"></span>, <span th:text="${addr.province}"></span></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-end; justify-content: center;">
        <button type="button" th:data-id="${addr.idAddress}" th:data-prov="${addr.province}" th:data-mun="${addr.municipality}" th:data-brgy="${addr.brgy}" th:data-street="${addr.street}" th:data-type="${addr.addressType}" onclick="openAddressModalFromBtn(this)" style="background: none; border: none; color: #2673dd; cursor: pointer; font-weight: bold;">Edit</button>
        <form th:action="@{/checkout/delete-address}" method="post">
          <input type="hidden" name="addressId" th:value="${addr.idAddress}">
          <button type="submit" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 600;">Delete</button>
        </form>
      </div>
    </div>
  </div>

  <div id="addressModal" class="modal" style="display: none; align-items: center; justify-content: center;">
    <div style="background: var(--card-bg); width: 500px; border-radius: var(--border-radius); box-shadow: var(--shadow-md); display: flex; flex-direction: column; overflow: hidden;">
      <div id="addressModalTitle" style="padding: 25px; border-bottom: 1px solid var(--border-color); font-size: 1.2em; font-weight: bold; color: var(--text-main);">New Address</div>

      <form th:action="@{/checkout/save-address}" method="post" id="addressForm" style="padding: 25px; display: flex; flex-direction: column; gap: 20px;">
        <input type="hidden" name="idAddress" id="formIdAddress">
        <input type="hidden" name="redirectUrl" value="/account/addresses"> <select id="provinceSelect" name="province" class="form-control" required>
        <option value="" disabled selected>Select Province</option>
      </select>
        <select id="municipalitySelect" name="municipality" class="form-control" required disabled>
          <option value="" disabled selected>Select City, Municipality</option>
        </select>
        <select id="brgySelect" name="brgy" class="form-control" required disabled>
          <option value="" disabled selected>Select Barangay</option>
        </select>
        <input type="text" id="streetInput" name="street" class="form-control" placeholder="Street Name, Building, House No." required>

        <div>
          <label style="color: var(--text-muted); font-size: 0.9em; display: block; margin-bottom: 10px; font-weight: 600;">Label As:</label>
          <div style="display: flex; gap: 15px;">
            <label class="type-label" style="border: 1px solid var(--border-color); padding: 8px 25px; border-radius: 50px; cursor: pointer; position: relative; font-weight: 600; color: var(--text-main); transition: all 0.3s;">
              <input type="radio" name="addressType" value="Home" required style="position: absolute; opacity: 0; width: 0; height: 0;"> Home
            </label>
            <label class="type-label" style="border: 1px solid var(--border-color); padding: 8px 25px; border-radius: 50px; cursor: pointer; position: relative; font-weight: 600; color: var(--text-main); transition: all 0.3s;">
              <input type="radio" name="addressType" value="Work" required style="position: absolute; opacity: 0; width: 0; height: 0;"> Work
            </label>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 10px;">
          <button type="button" onclick="document.getElementById('addressModal').style.display='none'" style="background: transparent; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 25px; cursor: pointer; font-weight: 600; color: var(--text-muted);">Cancel</button>
          <button type="submit" class="btn-theme" style="width: auto; padding: 10px 35px;">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const psgcBaseUrl = 'https://psgc.gitlab.io/api';
    const provinceSelect = document.getElementById('provinceSelect');
    const municipalitySelect = document.getElementById('municipalitySelect');
    const brgySelect = document.getElementById('brgySelect');
    let provincesLoaded = false;

    function formatLocationName(str) { return str.toLowerCase().replace(' (capital)', '').split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' '); }
    function setSelectByText(selectObj, textToMatch) {
      if (!textToMatch) return null;
      const search = textToMatch.toLowerCase().trim();
      for (let i = 0; i < selectObj.options.length; i++) {
        if (selectObj.options[i].text.toLowerCase() === search) {
          selectObj.selectedIndex = i; return selectObj.options[i];
        }
      } return null;
    }

    async function loadProvinces() {
      try {
        const response = await fetch(`${psgcBaseUrl}/provinces`); const data = await response.json();
        data.sort((a, b) => a.name.localeCompare(b.name));
        data.forEach(prov => {
          let cleanName = formatLocationName(prov.name);
          let option = new Option(cleanName, cleanName);
          option.dataset.code = prov.code; provinceSelect.appendChild(option);
        });
        provincesLoaded = true;
      } catch (error) { console.error(error); }
    }

    async function loadMunicipalities(provCode) {
      municipalitySelect.innerHTML = '<option value="" disabled selected>Loading...</option>'; municipalitySelect.disabled = true;
      try {
        const response = await fetch(`${psgcBaseUrl}/provinces/${provCode}/cities-municipalities`); const data = await response.json();
        data.sort((a, b) => a.name.localeCompare(b.name));
        municipalitySelect.innerHTML = '<option value="" disabled selected>Select City, Municipality</option>';
        data.forEach(mun => {
          let cleanName = formatLocationName(mun.name);
          let option = new Option(cleanName, cleanName);
          option.dataset.code = mun.code; municipalitySelect.appendChild(option);
        });
        municipalitySelect.disabled = false;
      } catch (error) { console.error(error); }
    }

    async function loadBarangays(munCode) {
      brgySelect.innerHTML = '<option value="" disabled selected>Loading...</option>'; brgySelect.disabled = true;
      try {
        const response = await fetch(`${psgcBaseUrl}/cities-municipalities/${munCode}/barangays`); const data = await response.json();
        data.sort((a, b) => a.name.localeCompare(b.name));
        brgySelect.innerHTML = '<option value="" disabled selected>Select Barangay</option>';
        data.forEach(brgy => {
          let cleanName = formatLocationName(brgy.name);
          brgySelect.appendChild(new Option(cleanName, cleanName));
        });
        brgySelect.disabled = false;
      } catch (error) { console.error(error); }
    }

    provinceSelect.addEventListener('change', function() {
      const code = this.options[this.selectedIndex].dataset.code;
      brgySelect.innerHTML = '<option value="" disabled selected>Select Barangay</option>'; brgySelect.disabled = true;
      if (code) loadMunicipalities(code);
    });

    municipalitySelect.addEventListener('change', function() {
      const code = this.options[this.selectedIndex].dataset.code;
      if (code) loadBarangays(code);
    });

    document.querySelectorAll('input[name="addressType"]').forEach(radio => {
      radio.addEventListener('change', function() {
        document.querySelectorAll('.type-label').forEach(lbl => {
          lbl.style.borderColor = 'var(--border-color)'; lbl.style.color = 'var(--text-main)'; lbl.style.background = 'transparent';
        });
        if(this.checked) {
          this.parentElement.style.borderColor = 'var(--theme-color)'; this.parentElement.style.color = 'var(--theme-color)'; this.parentElement.style.background = 'rgba(255,100,49,0.05)';
        }
      });
    });

    function openAddressModalFromBtn(btn) {
      openAddressModal(btn.getAttribute('data-id'), btn.getAttribute('data-prov'), btn.getAttribute('data-mun'), btn.getAttribute('data-brgy'), btn.getAttribute('data-street'), btn.getAttribute('data-type'));
    }

    async function openAddressModal(id = '', prov = '', mun = '', brgy = '', street = '', type = '') {
      document.getElementById('addressModal').style.display = 'flex';
      document.getElementById('addressModalTitle').textContent = id ? 'Edit Address' : 'New Address';
      document.getElementById('formIdAddress').value = id;
      document.getElementById('streetInput').value = street;

       document.getElementById('addressForm').action = "/checkout/save-address?redirect=/account/addresses";

      if (!provincesLoaded) await loadProvinces();

      if(prov) {
        const selectedProv = setSelectByText(provinceSelect, prov);
        if (selectedProv && selectedProv.dataset.code) {
          await loadMunicipalities(selectedProv.dataset.code);
          const selectedMun = setSelectByText(municipalitySelect, mun);
          if (selectedMun && selectedMun.dataset.code) {
            await loadBarangays(selectedMun.dataset.code);
            setSelectByText(brgySelect, brgy);
          }
        }
      } else {
        provinceSelect.value = "";
        municipalitySelect.innerHTML = '<option value="" disabled selected>Select City, Municipality</option>';
        brgySelect.innerHTML = '<option value="" disabled selected>Select Barangay</option>';
        municipalitySelect.disabled = true; brgySelect.disabled = true;
      }

      document.querySelectorAll('input[name="addressType"]').forEach(r => {
        r.checked = (r.value === type);
        r.dispatchEvent(new Event('change'));
      });
    }
  </script>
</main>
</body>
</html>
