<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
<main class="main-container">

    <div style="background: var(--card-bg); padding: 25px 30px; border-radius: var(--border-radius); box-shadow: var(--shadow-sm); margin-bottom: 35px; border: 1px solid var(--border-color);">
        <h2 th:text="${category.categoryName}" style="color: var(--theme-color); margin: 0 0 8px 0; font-weight: 700;"></h2>
        <p th:text="${category.description}" style="color: var(--text-muted); margin: 0; font-size: 0.95em; font-weight: 500;"></p>
    </div>

    <div th:if="${#lists.isEmpty(products)}" style="text-align: center; padding: 60px 20px; background: var(--card-bg); border-radius: var(--border-radius); box-shadow: var(--shadow-sm);">
        <h3 style="color: var(--text-muted); margin: 0;">No artisan handicrafts listed under this category yet.</h3>
    </div>

    <div class="product-grid" id="categoryProductGrid" th:if="${!#lists.isEmpty(products)}">
        <div th:each="product : ${products}" th:remove="tag">
            <a th:href="@{/products/{id}(id=${product.idProduct})}" class="product-card" data-tilt>
                <div class="product-image-container">
                    <img th:src="@{/products/image/{id}(id=${product.idProduct})}">
                </div>
                <div class="product-info">
                    <h4 class="product-title" th:text="${product.productName}"></h4>
                    <div class="price-row">
                        <div>
                            <span th:if="${product.originalPrice != null}" class="price-original" th:text="'₱' + ${product.originalPrice}"></span>
                            <span class="price-current" th:text="'₱' + ${product.productPrice}"></span>
                        </div>
                        <span class="product-sold" th:text="${product.totalSold} + ' sold'"></span>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div th:if="${!#lists.isEmpty(products)}" style="display: flex; justify-content: center; margin: 40px 0 20px 0; width: 100%;">
        <button id="loadMoreCatBtn" onclick="loadNextCategoryBatch()" class="btn-theme" style="width: auto; padding: 12px 60px; font-size: 1.05em; font-weight: bold; border-radius: 30px; box-shadow: var(--shadow-sm);">
            Load More
        </button>
    </div>

    <script th:inline="javascript">
        // Start at page 1 because page 0 is loaded by the initial HTML render
        let categoryFeedPage = 1;
        let isCatLoading = false;

        const categoryId = /*[[${category.idCategory}]]*/ 0;

        function loadNextCategoryBatch() {
            if (isCatLoading) return;
            isCatLoading = true;

            const button = document.getElementById('loadMoreCatBtn');
            if (button) {
                button.innerText = 'Loading...';
                button.disabled = true;
                button.style.opacity = '0.7';
            }

            fetch(`/category/${categoryId}/feed?page=${categoryFeedPage}`)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(htmlFragment => {
                     if (htmlFragment.trim().length < 20) {
                        if (button) button.style.display = 'none';
                        return;
                    }

                    const grid = document.getElementById('categoryProductGrid');
                    if (grid) {
                        grid.insertAdjacentHTML('beforeend', htmlFragment);
                    }

                    categoryFeedPage++;

                    if (typeof VanillaTilt !== 'undefined') {
                        VanillaTilt.init(document.querySelectorAll("#categoryProductGrid .product-card:not(.js-tilt)"), {
                            max: 12, speed: 400, glare: true, "max-glare": 0.15, scale: 1.02
                        });
                    }

                    // Restore button state
                    isCatLoading = false;
                    if (button) {
                        button.innerText = 'Load More';
                        button.disabled = false;
                        button.style.opacity = '1';
                    }
                })
                .catch(err => {
                    console.error('Error fetching category products:', err);
                    isCatLoading = false;
                    if (button) {
                        button.innerText = 'Try Again';
                        button.disabled = false;
                        button.style.opacity = '1';
                    }
                });
        }
    </script>
</main>
</body>
</html>
