<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div})}">
<body>
<div class="main-container" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
  <div style="background: var(--card-bg); padding: 40px; border-radius: var(--border-radius); box-shadow: var(--shadow-md); width: 100%; max-width: 450px;">

    <h2 style="text-align: center; margin-top: 0; color: var(--text-main); margin-bottom: 10px;">Setup Your Artisan Shop</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px; font-weight: 500;">Join the community and start selling your handcrafted materials.</p>

    <form th:action="@{/start-selling}" method="post">
      <div class="form-group">
        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted);">Store Name</label>
        <input type="text" name="storeName" class="form-control" placeholder="e.g., Daraga Native Handicrafts" required>
      </div>
      <div class="form-group">
        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted);">Contact Number</label>
        <input type="text" name="contactNumber" class="form-control" placeholder="Mobile Number" required>
      </div>
      <button type="submit" class="btn-theme" style="margin-top: 20px;">Register Shop</button>
    </form>

  </div>
</div>
</body>
</html>
