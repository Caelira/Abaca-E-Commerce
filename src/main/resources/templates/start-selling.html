<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div})}">
<body>
<div style="background: white; padding: 20px; max-width: 400px; margin: auto;">
  <h2>Setup Your Shop</h2>
  <form th:action="@{/start-selling}" method="post">
    <div style="margin-bottom: 15px;">
      <label>Store Name</label>
      <input type="text" name="storeName" required style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 15px;">
      <label>Contact Number</label>
      <input type="text" name="contactNumber" required style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    <button type="submit" style="background: #ee4d2d; color: white; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer;">Register Shop</button>
  </form>
</div>
</body>
</html>
