<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
<main class="main-container">

    <div style="background: var(--card-bg); padding: 30px; border-radius: var(--border-radius); box-shadow: var(--shadow-sm); margin-bottom: 30px; text-align: center;">
        <h2 th:text="${category.categoryName}" style="color: var(--theme-color); margin-top: 0;"></h2>
        <p th:text="${category.description}" class="text-muted" style="margin: 0;"></p>
    </div>

    <div th:if="${#lists.isEmpty(products)}" style="text-align: center; padding: 50px;">
        <h3 class="text-muted">No products found in this category.</h3>
    </div>

    <div class="product-grid" id="productGrid" th:if="${!#lists.isEmpty(products)}">
        <div th:each="product : ${products}" th:remove="tag">
            <a th:href="@{/products/{id}(id=${product.idProduct})}" class="product-card" data-tilt data-tilt-max="7" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.1">
                <div class="product-image-container">
                    <img th:src="@{/products/image/{id}(id=${product.idProduct})}">
                </div>
                <div class="product-info">
                    <h4 class="product-title" th:text="${product.productName}"></h4>
                    <div class="price-row">
                        <div>
                            <span th:if="${product.originalPrice != null}" class="price-original" th:text="'₱' + ${product.originalPrice}"></span>
                            <span class="price-current" th:text="'₱' + ${product.productPrice}"></span>
                        </div>
                        <span class="product-sold" th:text="${product.totalSold} + ' sold'"></span>
                    </div>
                </div>
            </a>
        </div>
    </div>

</main>
</body>
</html>
