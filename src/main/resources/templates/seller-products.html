<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
<main class="main-container" style="display: flex; gap: 30px;">

    <div style="width: 250px; flex-shrink: 0;">
        <div style="background: var(--card-bg); padding: 30px; border-radius: var(--border-radius); box-shadow: var(--shadow-sm);">
            <h3 style="color: var(--text-main); margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">Seller Hub</h3>
            <ul style="list-style: none; padding: 0; line-height: 2.5; margin: 0;">
                <li><a th:href="@{/seller/dashboard}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">Dashboard</a></li>
                <li><a th:href="@{/seller/orders}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">My Orders</a></li>
                <li><a th:href="@{/seller/products}" style="text-decoration: none; color: var(--theme-color); font-weight: bold; display: flex; align-items: center; gap: 10px;">My Products</a></li>
                <li><a th:href="@{/seller/profile}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">Shop Profile</a></li>
            </ul>
        </div>
    </div>

    <div style="flex: 1; background: var(--card-bg); padding: 40px; border-radius: var(--border-radius); box-shadow: var(--shadow-sm);">

        <div th:if="${param.updated}" style="background: #e8f5e9; color: #2e7d32; padding: 15px; margin-bottom: 25px; border-radius: 8px; font-weight: 600;">
            ✓ Product successfully updated.
        </div>
        <div th:if="${param.deleted}" style="background: #ffebee; color: #c62828; padding: 15px; margin-bottom: 25px; border-radius: 8px; font-weight: 600;">
            ✓ Product successfully deleted.
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 30px;">
            <h2 style="margin: 0; color: var(--text-main);">My Inventory</h2>
            <a th:href="@{/seller/products/add}" class="btn-theme" style="width: auto; padding: 10px 25px; text-decoration: none;">+ Add New Product</a>
        </div>

        <div th:if="${#lists.isEmpty(products)}" style="padding: 60px; text-align: center; color: var(--text-muted); font-weight: 500; background: var(--body-bg); border-radius: 12px; border: 1px dashed var(--border-color);">
            You haven't added any products yet.
        </div>

        <div style="overflow-x: auto;">
            <table th:if="${!#lists.isEmpty(products)}" style="width: 100%; border-collapse: collapse; min-width: 700px;">
                <thead>
                <tr style="background: #fafafa; color: var(--text-muted); text-align: left; border-bottom: 2px solid var(--border-color);">
                    <th style="padding: 15px; font-weight: 600;">Product Name</th>
                    <th style="padding: 15px; font-weight: 600;">Price</th>
                    <th style="padding: 15px; font-weight: 600;">Stock</th>
                    <th style="padding: 15px; font-weight: 600;">Sold</th>
                    <th style="padding: 15px; text-align: right; font-weight: 600;">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}" style="border-bottom: 1px solid var(--border-color); transition: background 0.2s;">
                    <td style="padding: 15px; display: flex; align-items: center; gap: 15px;">
                        <img th:src="@{/products/image/{id}(id=${p.idProduct})}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px; box-shadow: var(--shadow-sm);">
                        <span th:text="${p.productName}" style="color: var(--text-main); font-weight: 600; max-width: 300px; display: inline-block;"></span>
                    </td>
                    <td style="padding: 15px; color: var(--text-main); font-weight: 800;">₱<span th:text="${p.productPrice}"></span></td>
                    <td style="padding: 15px; color: var(--text-muted); font-weight: 600;" th:text="${p.stockQuantity}"></td>
                    <td style="padding: 15px; color: var(--text-muted); font-weight: 600;" th:text="${p.totalSold}"></td>
                    <td style="padding: 15px; text-align: right;">
                        <div style="display: flex; justify-content: flex-end; gap: 15px; align-items: center;">
                            <a th:href="@{/seller/products/edit/{id}(id=${p.idProduct})}" style="color: #2673dd; text-decoration: none; font-weight: bold;">Edit</a>
                            <form th:action="@{/seller/products/delete}" method="post" onsubmit="return confirm('Are you sure you want to delete this product? This action cannot be undone.');" style="margin: 0;">
                                <input type="hidden" name="productId" th:value="${p.idProduct}">
                                <button type="submit" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-weight: 600; padding: 0; transition: color 0.3s;">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
</body>
</html>
