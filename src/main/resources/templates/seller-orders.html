<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
<main class="main-container" style="display: flex; gap: 30px;">

    <div style="width: 250px; flex-shrink: 0;">
        <div style="background: var(--card-bg); padding: 30px; border-radius: var(--border-radius); box-shadow: var(--shadow-sm);">
            <h3 style="color: var(--text-main); margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">Seller Hub</h3>
            <ul style="list-style: none; padding: 0; line-height: 2.5; margin: 0;">
                <li><a th:href="@{/seller/dashboard}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">Dashboard</a></li>
                <li><a th:href="@{/seller/orders}" style="text-decoration: none; color: var(--theme-color); font-weight: bold; display: flex; align-items: center; gap: 10px;">My Orders</a></li>
                <li><a th:href="@{/seller/products}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">My Products</a></li>
                <li><a th:href="@{/seller/profile}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">Shop Profile</a></li>
            </ul>
        </div>
    </div>

    <div style="flex: 1; background: var(--card-bg); padding: 40px; border-radius: var(--border-radius); box-shadow: var(--shadow-sm);">
        <h2 style="margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; color: var(--text-main); margin-bottom: 30px;">Incoming Orders</h2>

        <div th:if="${#lists.isEmpty(orderedItems)}" style="padding: 60px; text-align: center; color: var(--text-muted); font-weight: 500; background: var(--body-bg); border-radius: 12px; border: 1px dashed var(--border-color);">
            <div style="font-size: 3em; margin-bottom: 15px;">📋</div>
            No orders have been placed for your products yet.
        </div>

        <div th:each="item : ${orderedItems}" style="border: 1px solid var(--border-color); margin-bottom: 25px; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
            <div style="background: #fafafa; padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span style="font-weight: 700; color: var(--text-main); font-size: 1.1em;">Order ID: #<span th:text="${item.orderHead.idOrder}"></span></span>
                    <span style="color: var(--text-muted); margin-left: 15px; font-weight: 500;" th:text="${#temporals.format(item.orderHead.orderDate, 'dd MMM yyyy')}"></span>
                </div>
                <div style="color: var(--theme-color); font-weight: bold; background: rgba(255,100,49,0.1); padding: 5px 15px; border-radius: 50px; font-size: 0.85em; text-transform: uppercase;" th:text="${item.orderHead.orderStatus}"></div>
            </div>

            <div style="padding: 25px 20px; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; gap: 20px; align-items: center; width: 60%;">
                    <img th:src="@{/products/image/{id}(id=${item.product.idProduct})}" style="width: 70px; height: 70px; object-fit: cover; border-radius: 8px; box-shadow: var(--shadow-sm);">
                    <div>
                        <div style="font-weight: bold; color: var(--text-main); font-size: 1.1em;" th:text="${item.product.productName}"></div>
                        <div style="color: var(--text-muted); font-weight: 600; margin-top: 8px;">Qty: <span th:text="${item.orderQuantity}"></span></div>
                    </div>
                </div>

                <div style="width: 20%; text-align: center; color: var(--text-main); font-weight: 800; font-size: 1.2em;">
                    ₱<span th:text="${item.finalUnitPrice * item.orderQuantity}"></span>
                </div>

                <div style="width: 20%; text-align: right;">
                    <form th:if="${item.orderHead.orderStatus == 'PENDING'}" th:action="@{/seller/orders/ship}" method="post" style="margin: 0;">
                        <input type="hidden" name="orderId" th:value="${item.orderHead.idOrder}">
                        <button type="submit" class="btn-theme" style="width: auto; padding: 10px 20px;">
                            Arrange Shipment
                        </button>
                    </form>

                    <div th:if="${item.orderHead.orderStatus == 'SHIPPED'}" style="color: #2e7d32; font-weight: bold; padding: 10px 20px; border: 1px solid #4caf50; display: inline-block; border-radius: 8px; background: #e8f5e9;">
                        ✓ Shipped
                    </div>
                </div>
            </div>
        </div>
    </div>

</main>
</body>
</html>
