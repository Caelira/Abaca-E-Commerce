<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(content=~{::div})}">
<body>
<div class="main-container" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div style="text-align: center; padding: 60px 40px; background: var(--card-bg); border-radius: var(--border-radius); box-shadow: var(--shadow-md); max-width: 500px;">
        <h1 style="color: var(--theme-color); font-size: 4em; margin-top: 0; margin-bottom: 10px;">404</h1>
        <h3 style="color: var(--text-main); margin-bottom: 15px; font-size: 1.5em;">Page Not Found</h3>
        <p style="color: var(--text-muted); margin-bottom: 40px; font-weight: 500;">The page you are looking for does not exist or an unexpected error occurred.</p>
        <a th:href="@{/}" class="btn-theme" style="padding: 12px 40px; text-decoration: none; display: inline-block; width: auto;">Return to Homepage</a>
    </div>
</div>
</body>
</html>
