<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
<main class="main-container" style="display: flex; gap: 30px;">

    <div style="width: 250px; flex-shrink: 0;">
        <div style="background: var(--card-bg); padding: 30px; border-radius: var(--border-radius); box-shadow: var(--shadow-sm);">
            <h3 style="color: var(--text-main); margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">Seller Hub</h3>
            <ul style="list-style: none; padding: 0; line-height: 2.5; margin: 0;">
                <li><a th:href="@{/seller/dashboard}" style="text-decoration: none; color: var(--theme-color); font-weight: bold; display: flex; align-items: center; gap: 10px;">Dashboard</a></li>
                <li><a th:href="@{/seller/orders}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">My Orders</a></li>
                <li><a th:href="@{/seller/products}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">My Products</a></li>
                <li><a th:href="@{/seller/profile}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 10px; transition: color 0.3s;">Shop Profile</a></li>
            </ul>
        </div>
    </div>

    <div style="flex: 1;">
        <div style="background: var(--card-bg); padding: 40px; border-radius: var(--border-radius); box-shadow: var(--shadow-sm); margin-bottom: 30px;">
            <h2 style="margin-top: 0; color: var(--text-main);">Business Insights</h2>
            <div style="display: flex; gap: 25px; margin-top: 30px;">
                <div style="flex: 1; padding: 30px; background: var(--body-bg); border-radius: 12px; border: 1px solid var(--border-color); text-align: center; transition: box-shadow 0.3s;">
                    <div style="color: var(--text-muted); font-weight: 600; margin-bottom: 15px; font-size: 1.1em;">Total Sales Revenue</div>
                    <div style="color: var(--theme-color); font-size: 2.5em; font-weight: 800;">₱<span th:text="${totalSales}"></span></div>
                </div>
                <div style="flex: 1; padding: 30px; background: var(--body-bg); border-radius: 12px; border: 1px solid var(--border-color); text-align: center; transition: box-shadow 0.3s;">
                    <div style="color: var(--text-muted); font-weight: 600; margin-bottom: 15px; font-size: 1.1em;">Total Items Ordered</div>
                    <div style="color: #2673dd; font-size: 2.5em; font-weight: 800;" th:text="${totalOrders}"></div>
                </div>
            </div>
        </div>
    </div>

</main>
</body>
</html>
