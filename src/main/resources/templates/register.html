<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Sign Up</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm mt-5">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4">Sign Up</h3>

                    <form th:action="@{/register}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">I want to register as a</label>
                            <select name="role" class="form-select" required>
                                <option value="BUYER">Buyer</option>
                                <option value="SELLER">Seller</option>
                            </select>
                        </div>
                        <button type="submit" class="btn w-100 shopee-bg text-white mb-3">Sign Up</button>
                    </form>
                    <div class="text-center">
                        <span class="text-muted">Already have an account?</span> <a th:href="@{/login}" class="shopee-text text-decoration-none">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
