<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
<main class="main-container">

    <h2 class="section-title">Daily Discover</h2>

    <div class="product-grid" id="productGrid">
        <a th:each="product : ${products}" th:target="_self" th:href="@{/products/{id}(id=${product.idProduct})}" class="product-card" data-tilt>
            <div class="product-image-container">
                <img th:src="@{/products/image/{id}(id=${product.idProduct})}">
            </div>
            <div class="product-info">
                <h4 class="product-title" th:text="${product.productName}"></h4>
                <div class="price-row">
                    <div>
                        <span th:if="${product.originalPrice != null}" class="price-original" th:text="'₱' + ${product.originalPrice}"></span>
                        <span class="price-current" th:text="'₱' + ${product.productPrice}"></span>
                    </div>
                    <span class="product-sold" th:text="${product.totalSold} + ' sold'"></span>
                </div>
            </div>
        </a>
    </div>

    <div style="display: flex; justify-content: center; margin: 40px 0 20px 0; width: 100%;">
        <button id="loadMoreBtn" onclick="loadNextProductBatch()" class="btn-theme" style="width: auto; padding: 12px 60px; font-size: 1.05em; font-weight: bold; border-radius: 30px; box-shadow: var(--shadow-sm);">
            Load More
        </button>
    </div>

</main>
</body>
</html>
