<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: layout(~{::main})}">
<body>
<main class="main-container">

  <div style="background: var(--card-bg); padding: 30px; border-radius: var(--border-radius); display: flex; gap: 40px; box-shadow: var(--shadow-sm); margin-bottom: 50px;">
    <div style="width: 450px; flex-shrink: 0;">
      <div style="border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
        <img th:src="@{/products/image/{id}(id=${product.idProduct})}" style="width: 100%; height: 450px; object-fit: cover; display: block;">
      </div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column;">
      <h1 th:text="${product.productName}" style="margin-top: 0; font-size: 1.8em; color: var(--text-main); font-weight: 700; line-height: 1.3;"></h1>

      <div style="background: var(--body-bg); padding: 25px; border-radius: 12px; margin-bottom: 25px; margin-top: 15px; border: 1px solid var(--border-color);">
        <div th:if="${product.originalPrice != null}" style="text-decoration: line-through; color: var(--text-muted); margin-bottom: 8px; font-weight: 600;">
          ₱<span th:text="${product.originalPrice}"></span>
        </div>
        <h2 style="color: var(--theme-color); margin: 0; font-size: 2.5em; font-weight: 800;">₱<span th:text="${product.productPrice}"></span></h2>
      </div>

      <p style="color: var(--text-muted); display: flex; gap: 30px; font-size: 1.1em; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px;">
        <span>Stock: <strong th:text="${product.stockQuantity}" style="color: var(--text-main);"></strong></span>
        <span>Sold: <strong th:text="${product.totalSold}" style="color: var(--text-main);"></strong></span>
      </p>

      <div style="margin-bottom: 30px; padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; display: inline-flex; align-items: center; gap: 15px; background: #fafafa;">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--theme-color); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">
          <span th:text="${product.storeName != null ? #strings.substring(product.storeName, 0, 1).toUpperCase() : 'S'}"></span>
        </div>
        <div>
          <div style="font-weight: 600; color: var(--text-main);" th:text="${product.storeName != null ? product.storeName : 'Unknown Shop'}"></div>
          <a th:href="@{/shop/{id}(id=${product.idSeller})}" style="font-size: 0.85em; color: var(--theme-color); text-decoration: none; font-weight: 500;">View Shop →</a>
        </div>
      </div>

      <div sec:authorize="isAuthenticated()" style="margin-top: auto;">
        <form th:action="@{/cart/add}" method="post">
          <input type="hidden" name="productId" th:value="${product.idProduct}">

          <div style="display: flex; align-items: center; margin-bottom: 30px;">
            <span style="color: var(--text-muted); width: 100px; font-weight: 600;">Quantity</span>
            <div style="display: flex; align-items: center; gap: 15px;">
              <input type="number" name="quantity" value="1" min="1" th:max="${product.stockQuantity}" class="form-control" style="width: 80px; text-align: center; font-weight: bold; font-size: 1.1em;">
              <span style="color: var(--text-muted); font-size: 0.9em;" th:text="${product.stockQuantity} + ' pieces available'"></span>
            </div>
          </div>

          <div style="display: flex; gap: 20px;">
            <button type="submit" name="action" value="add" style="background: rgba(255,100,49,0.1); color: var(--theme-color); border: 2px solid var(--theme-color); padding: 15px 35px; border-radius: 8px; cursor: pointer; font-size: 1.05em; font-weight: bold; display: flex; align-items: center; gap: 10px; transition: all 0.3s;">
              🛒 Add To Cart
            </button>
            <button type="submit" name="action" value="buy" class="btn-theme" style="width: auto; padding: 15px 50px; font-size: 1.05em;">
              Buy Now
            </button>
          </div>
        </form>
      </div>

      <div sec:authorize="isAnonymous()" style="margin-top: auto;">
        <div style="display: flex; gap: 20px;">
          <button type="button" onclick="openLoginModal()" style="background: rgba(255,100,49,0.1); color: var(--theme-color); border: 2px solid var(--theme-color); padding: 15px 35px; border-radius: 8px; cursor: pointer; font-size: 1.05em; font-weight: bold;">🛒 Add To Cart</button>
          <button type="button" onclick="openLoginModal()" class="btn-theme" style="width: auto; padding: 15px 50px; font-size: 1.05em;">Buy Now</button>
        </div>
      </div>

    </div>
  </div>

  <div>
    <h2 class="section-title">You May Also Like</h2>
    <div class="product-grid" id="productGrid">
      <div th:each="recProduct : ${recommendedProducts}" th:remove="tag">
        <a th:href="@{/products/{id}(id=${recProduct.idProduct})}" class="product-card" data-tilt data-tilt-max="7" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.1">
          <div class="product-image-container">
            <img th:src="@{/products/image/{id}(id=${recProduct.idProduct})}">
          </div>
          <div class="product-info">
            <h4 class="product-title" th:text="${recProduct.productName}"></h4>
            <div class="price-row">
              <div>
                <span th:if="${recProduct.originalPrice != null}" class="price-original" th:text="'₱' + ${recProduct.originalPrice}"></span>
                <span class="price-current" th:text="'₱' + ${recProduct.productPrice}"></span>
              </div>
              <span class="product-sold" th:text="${recProduct.totalSold} + ' sold'"></span>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>

</main>
</body>
</html>
