<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
<!-- search res -->
<main class="main-container">

    <div style="background: var(--card-bg); padding: 20px; border-radius: var(--border-radius); margin-bottom: 20px; box-shadow: var(--shadow-sm);">
        <span style="font-size: 1.2em; color: var(--text-main);">Search results for '</span><strong style="color: var(--theme-color); font-size: 1.2em;" th:text="${keyword}"></strong><span style="font-size: 1.2em; color: var(--text-main);">'</span>
    </div>

    <div th:if="${!#lists.isEmpty(shops)}" style="margin-bottom: 40px;">
        <h3 class="section-title">Shops Found</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
            <div th:each="shop : ${shops}" style="background: var(--card-bg); padding: 20px; border-radius: var(--border-radius); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 20px; border: 1px solid var(--border-color);">
                <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--theme-color); display: flex; align-items: center; justify-content: center; font-size: 1.8em; color: white; font-weight: bold; overflow: hidden;">
                    <img th:if="${shop.userAccount.userProfile != null}" th:src="@{/account/profile-image/{id}(id=${shop.userAccount.idUser})}" style="width: 100%; height: 100%; object-fit: cover;">
                    <span th:unless="${shop.userAccount.userProfile != null}" th:text="${#strings.substring(shop.storeName, 0, 1).toUpperCase()}"></span>
                </div>
                <div style="flex: 1;">
                    <h4 style="margin: 0 0 5px 0; color: var(--text-main);" th:text="${shop.storeName}"></h4>
                    <div style="font-size: 0.85em; color: var(--text-muted); margin-bottom: 10px;">Artisan Seller</div>
                    <a th:href="@{/shop/{id}(id=${shop.idSeller})}" class="btn-theme" style="padding: 5px 15px; font-size: 0.85em; display: inline-block; width: auto; background: transparent; color: var(--theme-color); border: 1px solid var(--theme-color);">Visit Shop</a>
                </div>
            </div>
        </div>
    </div>

    <h3 class="section-title">Products Found</h3>

    <div th:if="${#lists.isEmpty(products)}" style="background: var(--card-bg); padding: 80px; text-align: center; border-radius: var(--border-radius); box-shadow: var(--shadow-sm);">
        <h3 class="text-muted">No products found matching your search.</h3>
    </div>

    <div class="product-grid" id="productGrid" th:if="${!#lists.isEmpty(products)}">
        <div th:each="product : ${products}" th:remove="tag">
            <a th:href="@{/products/{id}(id=${product.idProduct})}" class="product-card" data-tilt data-tilt-max="7" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.1">
                <div class="product-image-container">
                    <img th:src="@{/products/image/{id}(id=${product.idProduct})}">
                </div>
                <div class="product-info">
                    <h4 class="product-title" th:text="${product.productName}"></h4>
                    <div class="price-row">
                        <div>
                            <span th:if="${product.originalPrice != null}" class="price-original" th:text="'₱' + ${product.originalPrice}"></span>
                            <span class="price-current" th:text="'₱' + ${product.productPrice}"></span>
                        </div>
                        <span class="product-sold" th:text="${product.totalSold} + ' sold'"></span>
                    </div>
                </div>
            </a>
        </div>
    </div>

</main>
</body>
</html>
