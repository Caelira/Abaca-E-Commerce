<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">
<body>
<!-- edit account-->
<main class="main-container" style="max-width: 900px;">

    <div style="background: var(--card-bg); padding: 40px; border-radius: var(--border-radius); box-shadow: var(--shadow-md);">
        <h2 style="margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; color: var(--text-main);">Account Settings</h2>

        <div th:if="${param.profileSuccess}" style="background: #E8F5E9; color: #2E7D32; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 600;">Profile updated successfully!</div>
        <div th:if="${param.passwordSuccess}" style="background: #E8F5E9; color: #2E7D32; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 600;">Password updated successfully!</div>

        <div style="display: flex; gap: 60px; margin-top: 30px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 300px;">
                <form th:action="@{/account/update-profile}" method="post" enctype="multipart/form-data">
                    <h3 style="color: var(--text-main); margin-bottom: 20px; font-size: 1.2em;">Personal Information</h3>

                    <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 25px;">
                        <img th:if="${currentUser.hasProfileImage()}" th:src="@{/account/profile-image/{id}(id=${currentUser.idUser})}" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-color); box-shadow: var(--shadow-sm);">
                        <div th:unless="${currentUser.hasProfileImage()}" style="width: 80px; height: 80px; border-radius: 50%; background: var(--theme-color); display: flex; align-items: center; justify-content: center; font-size: 2em; color: white; font-weight: bold; box-shadow: var(--shadow-sm);" th:text="${#strings.substring(currentUser.fullName != null ? currentUser.fullName : currentUser.username, 0, 1).toUpperCase()}"></div>

                        <div>
                            <label style="display: block; color: var(--text-main); font-weight: 700; margin-bottom: 5px;">Profile Picture</label>
                            <input type="file" name="profileImage" accept="image/*" class="form-control" style="padding: 8px; font-size: 0.9em; max-width: 250px;">
                        </div>
                    </div>

                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted);">Full Name</label>
                        <input type="text" name="fullName" th:value="${account.fullName}" class="form-control">
                    </div>

                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted);">Email Address (Login ID)</label>
                        <input type="email" name="email" th:value="${account.email}" required class="form-control">
                    </div>

                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted);">Phone Number</label>
                        <input type="text" name="phoneNumber" th:value="${account.phoneNumber}" class="form-control">
                    </div>

                    <button type="submit" class="btn-theme" style="margin-top: 10px;">Save Profile</button>
                </form>
            </div>

            <div style="width: 1px; background: var(--border-color); display: block;"></div>

            <div style="flex: 1; min-width: 300px;">
                <form th:action="@{/account/update-password}" method="post">
                    <h3 style="color: var(--text-main); margin-bottom: 20px; font-size: 1.2em;">Security</h3>

                    <div class="form-group">
                        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted);">Change Password</label>
                        <input type="password" name="newPassword" required placeholder="Enter new password" class="form-control">
                    </div>

                    <button type="submit" class="btn-theme" style="margin-top: 10px; background: transparent; border: 2px solid var(--theme-color); color: var(--theme-color);">Update Password</button>
                </form>
            </div>
        </div>
    </div>

</main>
</body>
</html>
